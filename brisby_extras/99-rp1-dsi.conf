# X.org config for Raspberry Pi 5 RP1 DSI (e.g. JD9365DA-H3 panel).
# Use when X reports "no screens found" because it only sees card0 (HDMI) with no
# connected output; the DSI panel is on card1 (drm-rp1-dsi).
#
# On Balena OS, copy into your app image. Install as 99-z-rp1-dsi.conf so it
# loads AFTER the base image's Pi 5 inject (e.g. 99-rpi5.conf) and takes precedence:
#   COPY 99-rp1-dsi.conf /etc/X11/xorg.conf.d/99-z-rp1-dsi.conf
#
# Same content as casco-web/browser/99-rp1-dsi.conf.

Section "ServerFlags"
  Option "AutoAddDevices" "false"
  Option "AutoEnableDevices" "false"
  Option "AutoAddGPU" "false"
EndSection

Section "Device"
  Identifier "RP1DSI"
  Driver "modesetting"
  Option "kmsdev" "/dev/dri/card1"
  Option "AccelMethod" "none"
EndSection

Section "Monitor"
  Identifier "DSI-1"
  Option "PreferredMode" "720x1600"
EndSection

Section "Screen"
  Identifier "Screen0"
  Device "RP1DSI"
  Monitor "DSI-1"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "720x1600"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "Layout0"
  Screen "Screen0"
EndSection

# Override the base image's "Default" layout so X uses our DSI screen, not card0.
Section "ServerLayout"
  Identifier "Default"
  Screen "Screen0"
EndSection
